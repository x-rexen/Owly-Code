<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode - Wandbox</title>
    
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    
    <style>
        .CodeMirror {
            height: 400px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Est. Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    
    <script>
        // ===== 初始化 CodeMirror =====
        const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
            mode: 'text/x-c++src',      // C++ 语法高亮
            theme: 'dracula',            // 暗色主题
            lineNumbers: true,           // 🔢 行号
            matchBrackets: true,         // {} 高亮匹配
            autoCloseBrackets: true,     // 自动补全 } ]
            indentUnit: 4,               // Tab = 4 空格
            tabSize: 4,
            indentWithTabs: false,
            extraKeys: {
                "Tab": function(cm) {    // 🎯 Tab 键缩进
                    cm.replaceSelection("    ", "end");
                }
            }
        });
        
        // ===== 代码模板 =====
        const templates = {
            "A+B": `#include <iostream>
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}`,
            "Loop": `#include <iostream>
using namespace std;
int main() {
    for (int i = 0; i < 10; i++) {
        cout << i << " ";
    }
    return 0;
}`,
            "Array": `#include <iostream>
#include <vector>
using namespace std;
int main() {
    vector<int> arr = {1, 2, 3, 4, 5};
    for (int x : arr) cout << x << " ";
    return 0;
}`
        };
        
        // 设置默认模板
        editor.setValue(templates["A+B"]);
        
        // ===== 模板切换 =====
        function setTemplate(name) {
            if (templates[name]) {
                editor.setValue(templates[name]);
            }
        }
        
        // ===== Wandbox API =====
        const CORS_PROXY = 'https://corsproxy.io/?';
        const WANDBOX_URL = 'https://wandbox.org/api/compile.json';
        const API_URL = CORS_PROXY + encodeURIComponent(WANDBOX_URL);
        
        async function runCode() {
            const code = editor.getValue();  // 从 CodeMirror 获取代码
            const stdin = document.getElementById('stdin').value;
            
            document.getElementById('output').textContent = 'Running...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            const startTime = performance.now();
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: code,
                        stdin: stdin
                    })
                });
                
                const data = await res.json();
                const totalTime = (performance.now() - startTime) / 1000;
                document.getElementById('time').textContent = totalTime.toFixed(4);
                
                if (data.program_output) {
                    document.getElementById('output').textContent = data.program_output;
                } else if (data.compiler_error) {
                    document.getElementById('output').textContent = data.compiler_error;
                    document.getElementById('error').textContent = 'Compile Error';
                } else if (data.program_error) {
                    document.getElementById('output').textContent = data.program_error;
                    document.getElementById('error').textContent = 'Runtime Error';
                } else {
                    document.getElementById('output').textContent = '(no output)';
                }
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
            }
        }
    </script>

</body>
</html>
