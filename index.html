<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode</title>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code" rows="12" cols="80">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br><br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Estimated Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>
    
    <details>
        <summary>🔍 Debug Info</summary>
        <p>Network baseline: <span id="baseline"></span>s</p>
        <p>Total time: <span id="total"></span>s</p>
        <pre id="debug"></pre>
    </details>

    <script>
        async function runCode() {
            const code = document.getElementById('code').value;
            const stdin = document.getElementById('stdin').value;
            
            document.getElementById('output').textContent = 'Measuring network...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            try {
                const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
                const WANDBOX_URL = 'https://wandbox.org/api/compile.json';
                const API_URL = CORS_PROXY + encodeURIComponent(WANDBOX_URL);
                
                // ===== 第一次：空跑，测网络延迟 =====
                const startBaseline = performance.now();
                
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: 'int main(){}',
                        stdin: ''
                    })
                });
                
                const endBaseline = performance.now();
                const baseline = (endBaseline - startBaseline) / 1000;
                document.getElementById('baseline').textContent = baseline.toFixed(4);
                
                // ===== 第二次：跑真实代码 =====
                document.getElementById('output').textContent = 'Running your code...';
                
                const startReal = performance.now();
                
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: code,
                        stdin: stdin
                    })
                });
                
                const data = await res.json();
                
                const endReal = performance.now();
                const totalTime = (endReal - startReal) / 1000;
                document.getElementById('total').textContent = totalTime.toFixed(4);
                
                // ===== 估算执行时间 =====
                const estimatedCpuTime = totalTime - baseline;
                document.getElementById('time').textContent = estimatedCpuTime.toFixed(4);
                
                // ===== 显示结果 =====
                if (data.program_output) {
                    document.getElementById('output').textContent = data.program_output;
                }
                else if (data.compiler_error) {
                    document.getElementById('output').textContent = data.compiler_error;
                    document.getElementById('error').textContent = 'Compile Error';
                }
                else if (data.program_error) {
                    document.getElementById('output').textContent = data.program_error;
                    document.getElementById('error').textContent = 'Runtime Error';
                }
                else {
                    document.getElementById('output').textContent = '(no output)';
                }
                
                document.getElementById('debug').textContent = JSON.stringify(data, null, 2);
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
            }
        }
    </script>

</body>
</html>
