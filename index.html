<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode</title>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code" rows="12" cols="80">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br><br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>

    <script>
        async function runCode() {
            const code = document.getElementById('code').value;
            const stdin = document.getElementById('stdin').value;
            
            document.getElementById('output').textContent = 'Running...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            try {
                const res = await fetch('https://wandbox.org/api/compile.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: code,
                        stdin: stdin
                    })
                });
                
                const data = await res.json();
                
                document.getElementById('output').textContent = data.program_output || '(no output)';
                document.getElementById('time').textContent = (data.executed || 0).toFixed(4);
                
                if (data.compiler_error) {
                    document.getElementById('error').textContent = 'Compile Error: ' + data.compiler_error;
                }
                if (data.program_error) {
                    document.getElementById('error').textContent = 'Runtime Error: ' + data.program_error;
                }
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
            }
        }
    </script>

</body>
</html>
