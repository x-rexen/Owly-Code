<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode - Wandbox</title>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code" rows="12" cols="80">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br><br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>

    <script>
        async function runCode() {
            const code = document.getElementById('code').value;
            const stdin = document.getElementById('stdin').value;
            const TIME_LIMIT = 2.0;
            
            document.getElementById('output').textContent = 'Running...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            const startTime = performance.now();
            
            try {
                const CORS_PROXY = 'https://corsproxy.io/?';
                const WANDBOX_URL = 'https://wandbox.org/api/compile.json';
                
                const res = await fetch(CORS_PROXY + encodeURIComponent(WANDBOX_URL), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: code,
                        stdin: stdin
                    })
                });
                
                const data = await res.json();
                
                const endTime = performance.now();
                const elapsed = (endTime - startTime) / 1000;
                
                // 判断超时（粗略判断，包含网络延迟）
                if (elapsed > 5 && !data.program_output) {
                    document.getElementById('output').textContent = 'Time Limit Exceeded (or Timeout)';
                    document.getElementById('time').textContent = '> ' + TIME_LIMIT + 's (waited ' + elapsed.toFixed(2) + 's)';
                }
                else if (data.program_output) {
                    document.getElementById('output').textContent = data.program_output;
                    document.getElementById('time').textContent = elapsed.toFixed(4) + ' (incl. network)';
                }
                else if (data.compiler_error) {
                    document.getElementById('output').textContent = data.compiler_error;
                    document.getElementById('time').textContent = elapsed.toFixed(4) + ' (incl. network)';
                }
                else {
                    document.getElementById('output').textContent = data.program_error || '(no output)';
                    document.getElementById('time').textContent = elapsed.toFixed(4) + ' (incl. network)';
                }
                
                if (data.compiler_error) {
                    document.getElementById('error').textContent = 'Compile Error';
                }
                if (data.program_error) {
                    document.getElementById('error').textContent = 'Runtime Error';
                }
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
                document.getElementById('output').textContent = '';
                document.getElementById('time').textContent = 'Error';
            }
        }
    </script>

</body>
</html>
