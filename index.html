<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode - Wandbox</title>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code" rows="12" cols="80">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br><br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Est. Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>

    <script>
        const CORS_PROXY = 'https://corsproxy.io/?';
        const WANDBOX_URL = 'https://wandbox.org/api/compile.json';
        const API_URL = CORS_PROXY + encodeURIComponent(WANDBOX_URL);
        const TIME_LIMIT = 10;
        
        async function runCode() {
            const code = document.getElementById('code').value;
            const stdin = document.getElementById('stdin').value;
            
            document.getElementById('output').textContent = 'Measuring...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            try {
                // ===== 第一次：空跑，测网络延迟 =====
                const startBaseline = performance.now();
                
                const controller1 = new AbortController();
                const timeout1 = setTimeout(() => controller1.abort(), TIME_LIMIT * 1000);
                
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: 'int main(){}',
                        stdin: ''
                    }),
                    signal: controller1.signal
                });
                
                clearTimeout(timeout1);
                
                const baseline = (performance.now() - startBaseline) / 1000;
                
                // ===== 第二次：跑真实代码 =====
                document.getElementById('output').textContent = 'Running...';
                
                const startReal = performance.now();
                
                const controller2 = new AbortController();
                const timeout2 = setTimeout(() => controller2.abort(), TIME_LIMIT * 1000);
                
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head',
                        code: code,
                        stdin: stdin
                    }),
                    signal: controller2.signal
                });
                
                clearTimeout(timeout2);
                
                const data = await res.json();
                const totalTime = (performance.now() - startReal) / 1000;
                
                // ===== 估算执行时间 =====
                const estimatedTime = totalTime - baseline;
                document.getElementById('time').textContent = estimatedTime.toFixed(4);
                
                // ===== 显示输出 =====
                if (data.program_output) {
                    document.getElementById('output').textContent = data.program_output;
                } else if (data.compiler_error) {
                    document.getElementById('output').textContent = data.compiler_error;
                    document.getElementById('error').textContent = 'Compile Error';
                } else if (data.program_error) {
                    document.getElementById('output').textContent = data.program_error;
                    document.getElementById('error').textContent = 'Runtime Error';
                } else {
                    document.getElementById('output').textContent = '(no output)';
                }
                
            } catch (err) {
                if (err.name === 'AbortError') {
                    document.getElementById('output').textContent = 'Time Limit Exceeded (>10s)';
                    document.getElementById('time').textContent = '>10';
                } else {
                    document.getElementById('error').textContent = 'Error: ' + err.message;
                }
            }
        }
    </script>

</body>
</html>
