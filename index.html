<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>OwlyCode</title>
</head>
<body>

    <h1>🦉👓 OwlyCode</h1>
    
    <p>Write your C++ code:</p>
    <textarea id="code" rows="12" cols="80">#include &lt;iostream&gt;
using namespace std;
int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b;
    return 0;
}</textarea>
    
    <br><br>
    
    <label>Input (stdin):</label>
    <input type="text" id="stdin" size="30" value="3 5">
    
    <br><br>
    
    <label>⏰ Time Limit (seconds):</label>
    <input type="number" id="timeLimit" value="2" min="1" max="10" step="1" style="width:60px">
    
    <br><br>
    
    <button onclick="runCode()">▶ Run Code</button>
    
    <hr>
    
    <h3>Output:</h3>
    <pre id="output"></pre>
    
    <p>⏱️ Time: <span id="time"></span>s</p>
    <p style="color:red" id="error"></p>

    <script>
        async function runCode() {
            const code = document.getElementById('code').value;
            const stdin = document.getElementById('stdin').value;
            const TIME_LIMIT = parseFloat(document.getElementById('timeLimit').value);
            
            document.getElementById('output').textContent = 'Running...';
            document.getElementById('time').textContent = '...';
            document.getElementById('error').textContent = '';
            
            try {
                // 加上 CORS 代理
                const CORS_PROXY = 'https://corsproxy.io/?';
                const ONECOMPILER_URL = 'https://onecompiler.com/api/code/exec';
                
                const res = await fetch(CORS_PROXY + encodeURIComponent(ONECOMPILER_URL), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: 'cpp',
                        code: code,
                        input: stdin
                    })
                });
                
                const data = await res.json();
                
                const executionTime = data.executionTime || 0;
                
                if (executionTime > TIME_LIMIT) {
                    document.getElementById('output').textContent = 'Time Limit Exceeded';
                    document.getElementById('time').textContent = executionTime.toFixed(4);
                }
                else if (data.stdout) {
                    document.getElementById('output').textContent = data.stdout;
                    document.getElementById('time').textContent = executionTime.toFixed(4);
                }
                else if (data.compileError) {
                    document.getElementById('error').textContent = 'Compile Error: ' + data.compileError;
                    document.getElementById('time').textContent = executionTime.toFixed(4);
                }
                else if (data.stderr) {
                    document.getElementById('error').textContent = 'Runtime Error: ' + data.stderr;
                    document.getElementById('time').textContent = executionTime.toFixed(4);
                }
                else {
                    document.getElementById('output').textContent = '(no output)';
                    document.getElementById('time').textContent = executionTime.toFixed(4);
                }
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error: ' + err.message;
            }
        }
    </script>

</body>
</html>
